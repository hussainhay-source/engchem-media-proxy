services:
  - type: web
    name: engchem-media-proxy
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: APP_SECRET
        sync: false
      - key: MAX_FILE_MB
        value: "50"

      # ---------- إشعارات FCM (مجانية) ----------
      # انسخ محتوى ملف مفتاح الخدمة JSON كامل كسطر واحد.
      # Firebase Console → Project Settings → Service Accounts
      # → "Generate new private key" → انسخ الـ JSON كامل
      #
      # السيرفر يقرأ المحتوى بأكثر من طريقة، فحتى لو تلفت
      # الأسطر الجديدة بالنسخ واللصق بيصلّحها لحاله.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

      # اسم الموضوع اللي يشترك فيه كل الأجهزة
      - key: FCM_TOPIC
        value: "all_users"